# Build config dla brancha BillSplitterV2 (deploy testowy).
# Produkcja (main) pozostaje bez zmian do czasu merge.
[build]
  command = "npm run build"
  publish = "dist"

# Aplikacja jest jednostronicowa i czyta pokój z zapytania (`?group=…`), więc każdy
# adres musi trafić w `index.html`. Bez tego wejście linkiem do pokoju po odświeżeniu
# strony kończy się stroną 404 Netlify — a link do pokoju jest podstawową drogą wejścia.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Service worker i manifest NIE mogą siedzieć w pamięci podręcznej: inaczej po wydaniu
# nowej wersji telefon znajomego dalej chodzi na starym service workerze i widzi
# poprzednią aplikację, nie wiedząc dlaczego.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"

# Ikony też nie mogą siedzieć w pamięci podręcznej. Mają NIEZMIENNE nazwy plików
# (`icon-192x192.png` nazywa się tak samo przed i po podmianie rysunku), więc bez tego
# nagłówka przeglądarka pokazuje stary znak jeszcze długo po wydaniu nowego.
# Zasoby z katalogu `assets` mają skrót zawartości w nazwie i tego problemu nie mają.
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "no-cache"
